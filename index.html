    async function loadSession() {
      const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      const { data: { session } } = await client.auth.getSession();

      if (session && session.user) {
        currentUser = session.user;
        const isAdmin = session.user.email === 'rupali.eduquest@gmail.com' || session.user.email === 'admin@eduquest.com';
        document.getElementById('userName').textContent = session.user.user_metadata?.full_name || session.user.email;

        // Show logged-in nav, hide guest nav
        document.getElementById('navAuthLogged').style.display = 'flex';
        document.getElementById('navAuthGuest').style.display = 'none';

        if (isAdmin) {
          document.getElementById('adminLink').style.display = 'inline-block';
        }

        // Fetch user permissions from profiles (primary) or ap_profiles (fallback), checking by id and email
        let profile = null;
        const { data: pById } = await client.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
        profile = pById;

        if (!profile && session.user.email) {
          const { data: pByEmail } = await client.from('profiles').select('*').eq('email', session.user.email).maybeSingle();
          profile = pByEmail;
        }

        if (!profile) {
          const { data: apById } = await client.from('ap_profiles').select('*').eq('id', session.user.id).maybeSingle();
          profile = apById;
        }

        if (!profile && session.user.email) {
          const { data: apByEmail } = await client.from('ap_profiles').select('*').eq('email', session.user.email).maybeSingle();
          profile = apByEmail;
        }

        if (isAdmin) {
          // Admins get all tests unlocked
          Object.values(SUBJECT_TEST_CARDS).flat().forEach(t => unlockedList.push(t.id));
          FULL_MOCK_TEST_CARDS.forEach(t => unlockedList.push(t.id));
          DIAGNOSTIC_TEST_CARDS.forEach(t => unlockedList.push(t.id));
        } else if (profile) {
          if (profile.unlocked_tests) {
            try {
              const list = typeof profile.unlocked_tests === 'string' ? JSON.parse(profile.unlocked_tests) : profile.unlocked_tests;
              unlockedList = Array.from(new Set([...unlockedList, ...list]));
            } catch (e) { }
          }
          if (profile.has_ap_diag_access || profile.has_ap_diagnostic_access || profile.has_ap_access) {
            DIAGNOSTIC_TEST_CARDS.forEach(t => unlockedList.push(t.id));
          }
          if (profile.has_ap_topic_access || profile.has_ap_access) {
            // Unlock all topic tests
            Object.values(SUBJECT_TEST_CARDS).flat().forEach(t => unlockedList.push(t.id));
          }
          if (profile.has_ap_mock_access || profile.has_ap_access) {
            FULL_MOCK_TEST_CARDS.forEach(t => unlockedList.push(t.id));
            unlockedList.push('ap-mock-full-1');
          }
        }
      }
    }

    async function loadUserStats() {
      if (!currentUser) return;
      try {
        const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
        const { data: reports } = await client.from('ap_reports').select('ap_score').eq('email', currentUser.email);
        if (reports && reports.length > 0) {
          const elTests = document.getElementById('statTestsTaken');
          const elAvg = document.getElementById('statAvgAP');
          if (elTests) elTests.textContent = reports.length;
          if (elAvg) {
            const avg = (reports.reduce((acc, r) => acc + (r.ap_score || 1), 0) / reports.length).toFixed(1);
            elAvg.textContent = avg + ' / 5';
          }
        }
      } catch (e) { }
    }
